# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: '4.1'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', openxlsx2_testthat_fullrun: true}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      openxlsx2_testthat_fullrun: ${{ matrix.config.openxlsx2_testthat_fullrun }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - name: Use CRAN archive binaries only
        if: matrix.config.r == '4.1'
        shell: Rscript {0}
        run: |
          cat('options(repos = c(CRAN = "https://cran-archive.r-project.org"))\n',
              file = file.path(R.home("etc"), "Rprofile.site"), append = TRUE)

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ (matrix.config.r == '4.1') && 'rvg=?source' || '' }}
          needs: check

      - name: Restore the default repositories for the check
        if: matrix.config.r == '4.1'
        shell: Rscript {0}
        run: |
          f <- file.path(R.home("etc"), "Rprofile.site")
          x <- readLines(f)
          writeLines(x[!grepl("cran-archive.r-project.org", x, fixed = TRUE)], f)

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: ${{ (matrix.config.r == '4.1') && 'c("--no-manual","--no-build-vignettes")' || 'c("--no-manual","--compact-vignettes=gs+qpdf")' }}
          args: ${{ (matrix.config.r == '4.1') && 'c("--no-manual","--ignore-vignettes")' || 'c("--no-manual","--as-cran")' }}
